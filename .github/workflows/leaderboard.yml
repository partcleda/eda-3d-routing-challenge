name: submissions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # PR hygiene: a submission PR may only touch submissions/ and LEADERBOARD.md.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard paths on submission PRs
        run: |
          # fetch-depth: 0 already provides the full base branch; re-fetching it
          # shallowly breaks the merge-base lookup once the base has moved on.
          # --no-renames lists a rename as delete + add (so moving a file out of
          # a protected path is caught), and quotePath=false keeps non-ASCII
          # paths unquoted so they still match ^submissions/.
          base="origin/${{ github.base_ref }}"
          changed="$(git -c core.quotePath=false diff --name-only --no-renames "$base"...HEAD)"
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -q '^submissions/'; then
            bad="$(echo "$changed" | grep -vE '^(submissions/|LEADERBOARD\.md$|README\.md$)' || true)"
            if [ -n "$bad" ]; then
              echo "::error::A submission PR may only change submissions/**, LEADERBOARD.md and the generated leaderboard block of README.md."
              echo "Disallowed changes:"; echo "$bad"
              exit 1
            fi
            # every added or updated submission must report its runtime
            dirs="$(echo "$changed" | grep '^submissions/[^/_][^/]*/[^/]*/' | cut -d/ -f1-3 | sort -u)"
            existing=""
            for d in $dirs; do [ -d "$d" ] && existing="$existing $d"; done
            if [ -n "$existing" ]; then
              python3 scripts/check_submission_meta.py $existing
            fi
            # added or changed route files must not copy another entry's
            sols=""
            for f in $(echo "$changed" | grep '^submissions/[^/_][^/]*/[^/]*/[^/]*\.sol\.json$' || true); do
              [ -f "$f" ] && sols="$sols $f"
            done
            if [ -n "$sols" ]; then
              python3 scripts/check_copies.py $sols
            fi
            # README.md: only the generated leaderboard block may change
            if echo "$changed" | grep -qx 'README.md'; then
              strip() { sed '/^<!-- leaderboard:start/,/^<!-- leaderboard:end -->/d'; }
              if ! diff <(git show "$base:README.md" | strip) <(strip < README.md) > /dev/null; then
                echo "::error::A submission PR may only change README.md inside the generated leaderboard block."
                diff <(git show "$base:README.md" | strip) <(strip < README.md) || true
                exit 1
              fi
            fi
          fi

  # Toolkit + submissions are pure standard library, so they must pass on Linux
  # and macOS across supported Python versions. No third-party install, no GPU.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only)
        run: python -m unittest discover -s tests -q
      - name: Verify all submissions are legal
        run: python scripts/verify_submissions.py
      - name: Check LEADERBOARD.md is current
        run: python -m m3d.cli leaderboard-all --check
